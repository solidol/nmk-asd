<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title"><title id="title">Паралельні ребра та петлі</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><rect width="800" height="280" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><g transform="translate(10 10)"><text x="190" y="27" text-anchor="middle" font-size="18" font-weight="bold">Мультиграф</text><path d="M102 130 Q190 55 278 130 M102 150 Q190 225 278 150" fill="none" stroke="#475569" stroke-width="2.5"/><circle cx="85" cy="140" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="85" y="146" text-anchor="middle" font-size="18">A</text><circle cx="295" cy="140" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="295" y="146" text-anchor="middle" font-size="18">B</text><text x="190" y="242" text-anchor="middle" font-size="15">Два різні ребра між A та B</text></g><path d="M400 15 V265" stroke="#cbd5e1"/><g transform="translate(410 10)"><text x="190" y="27" text-anchor="middle" font-size="18" font-weight="bold">Псевдограф</text><path d="M105 140 L256 140" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M70 125 C5 35 165 35 100 125" fill="none" stroke="#475569" stroke-width="2.5"/><circle cx="85" cy="140" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="85" y="146" text-anchor="middle" font-size="18">A</text><circle cx="280" cy="140" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="280" y="146" text-anchor="middle" font-size="18">B</text><text x="190" y="242" text-anchor="middle" font-size="15">Петля в A; її внесок у ступінь — 2</text></g></g></svg>
