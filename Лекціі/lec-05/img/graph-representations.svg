<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Граф та списки суміжності</title>
  <desc id="desc">Ребра 0–1, 0–2, 1–2, 2–3. Вершина 4 ізольована. Праворуч перелічено сусідів кожної вершини.</desc>
  <rect width="900" height="340" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="40" y="38" font-size="22" font-weight="bold">Неорієнтований граф</text>
    <text x="490" y="38" font-size="22" font-weight="bold">Списки суміжності</text>
    <path d="M90 105 L255 105 L170 220 Z M170 220 L325 265" stroke="#475569" stroke-width="3" fill="none"/>
    <g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
      <circle cx="90" cy="105" r="25"/><circle cx="255" cy="105" r="25"/>
      <circle cx="170" cy="220" r="25"/><circle cx="325" cy="265" r="25"/>
      <circle cx="375" cy="130" r="25"/>
    </g>
    <g font-size="22" text-anchor="middle" dominant-baseline="central">
      <text x="90" y="105">0</text><text x="255" y="105">1</text>
      <text x="170" y="220">2</text><text x="325" y="265">3</text><text x="375" y="130">4</text>
    </g>
    <text x="375" y="179" font-size="16" text-anchor="middle">ізольована</text>
    <path d="M455 62 V310" stroke="#cbd5e1"/>
    <g font-family="Consolas, monospace" font-size="22">
      <text x="490" y="95">0: 1 → 2 → ∅</text>
      <text x="490" y="143">1: 0 → 2 → ∅</text>
      <text x="490" y="191">2: 0 → 1 → 3 → ∅</text>
      <text x="490" y="239">3: 2 → ∅</text>
      <text x="490" y="287">4: ∅</text>
    </g>
    <text x="40" y="317" font-size="17">n = 5, m = 4; дві компоненти зв’язності</text>
  </g>
</svg>
