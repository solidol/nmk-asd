<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title"><title id="title">Кількість вершин та ребер</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><rect width="800" height="280" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><g transform="translate(10 10)"><text x="190" y="27" text-anchor="middle" font-size="18" font-weight="bold">Безреберний і тривіальний</text><path d="M245 65 V195" stroke="#94a3b8" stroke-dasharray="5 5"/><circle cx="55" cy="125" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="55" y="131" text-anchor="middle" font-size="18">A</text><circle cx="120" cy="125" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120" y="131" text-anchor="middle" font-size="18">B</text><circle cx="185" cy="125" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="131" text-anchor="middle" font-size="18">C</text><circle cx="310" cy="125" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="310" y="131" text-anchor="middle" font-size="18">D</text><text x="190" y="242" text-anchor="middle" font-size="15">Ліворуч: n = 3, m = 0; праворуч: n = 1</text></g><path d="M400 15 V265" stroke="#cbd5e1"/><g transform="translate(410 10)"><text x="190" y="27" text-anchor="middle" font-size="18" font-weight="bold">Нескінченний ланцюг</text><path d="M115 130 L166 130" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M210 130 L261 130" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M30 130 H75 M305 130 H350" stroke="#475569" stroke-width="2.5" stroke-dasharray="5 5"/><text x="12" y="135">…</text><text x="355" y="135">…</text><circle cx="95" cy="130" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="95" y="136" text-anchor="middle" font-size="18">−1</text