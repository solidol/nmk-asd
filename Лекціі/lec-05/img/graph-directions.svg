<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title"><title id="title">Напрямки ребер</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs><rect width="800" height="280" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#0f172a"><g transform="translate(10 10)"><text x="190" y="27" text-anchor="middle" font-size="18" font-weight="bold">Неорієнтований</text><path d="M90 90 L276 90" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M285.23029012143746 103.48538728042665 L202.72365185427503 178.81753526348803" fill="none" stroke="#475569" stroke-width="2.5"/><circle cx="70" cy="90" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="70" y="96" text-anchor="middle" font-size="18">A</text><circle cx="300" cy="90" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="300" y="96" text-anchor="middle" font-size="18">B</text><circle cx="185" cy="195" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="201" text-anchor="middle" font-size="18">C</text><text x="190" y="242" text-anchor="middle" font-size="15">A — B — C: перехід в обидва боки</text></g><path d="M400 15 V265" stroke="#cbd5e1"/><g transform="translate(410 10)"><text x="190" y="27" text-anchor="middle" font-size="18" font-weight="bold">Орієнтований</text><path d="M90 90 L276 90" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M285.23029012143746 103.48538728042665 L202.72365185427503 178.81753526348803" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="70" cy="90" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="70" y="96" text-anchor="middle" font-size="18">A</text><circle cx="300" cy="90" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="300" y="96" text-anchor="middle" font-size="18">B</text><circle cx="185" cy="195" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="185" y="201" text-anchor="middle" font-size="18">C</text><text x="190" y="242" text-anchor="middle" font-size="15">A → B → C; з C до A шляху немає</text></g></g></svg>
