<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Кільцевий буфер</title>
<desc id="desc">У масиві значення 20, 30, вільна комірка, 10. Голова має індекс 3. Черга містить 10, 20, 30. Наступне вставлення відбудеться в комірку 2.</desc>
<rect width="900" height="450" rx="18" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
<text x="32" y="42" font-size="25" font-weight="700">Кільцева черга: порядок не збігається з індексами</text><text x="32" y="81" font-size="19">C = 4; head = 3; count = 3; місце вставлення = (3 + 3) mod 4 = 2</text><text x="172" y="126" font-size="20">0</text><rect x="110" y="148" width="150" height="64" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="158" y="189" font-size="21">20</text><text x="342" y="126" font-size="20">1</text><rect x="280" y="148" width="150" height="64" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="328" y="189" font-size="21">30</text><text x="512" y="126" font-size="20">2</text><rect x="450" y="148" width="150" height="64" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="488" y="189" font-size="21">вільно</text><text x="682" y="126" font-size="20">3</text><rect x="620" y="148" width="150" height="64" rx="10" fill="#dcfce7" stroke="#64748b"/><text x="668" y="189" font-size="21">10</text><text x="715" y="246" font-size="18" font-weight="700">head = 3</text><text x="440" y="277" font-size="18">наступне вставлення</text><path d="M695 220V301H181V222" fill="none" stroke="#475569" stroke-width="2"/><path d="M175 230L181 220L187 230Z" fill="#475569"/><text x="32" y="343" font-size="20">Логічний порядок: індекси 3 → 0 → 1, значення 10 → 20 → 30.</text><text x="32" y="383" font-size="19">Порожньо: count = 0. Повністю заповнено: count = C.</text><text x="32" y="420" font-size="19">Після вилучення 10: head = 0, count = 2. Елементи не зсуваються.</text>
</g>
</svg>
