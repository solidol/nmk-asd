<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Контракт і реалізації черги</title>
<desc id="desc">Чергу FIFO можна реалізувати кільцевим масивом або зв’язним списком. Обмеження місткості та відмови слід узгоджувати в контракті.</desc>
<rect width="900" height="450" rx="18" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
<text x="32" y="42" font-size="25" font-weight="700">АТД задає поведінку; реалізація — подання</text><rect x="32" y="68" width="836" height="100" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="52" y="103" font-size="22" font-weight="700">Контракт черги</text><text x="52" y="135" font-size="19">Додати 10, 20, 30 → вилучити 10, 20, 30. Правило FIFO.</text><path d="M450 168V205M230 205H670M230 205V231M670 205V231" fill="none" stroke="#475569" stroke-width="2"/><rect x="32" y="232" width="405" height="146" rx="10" fill="#dcfce7" stroke="#64748b"/><rect x="463" y="232" width="405" height="146" rx="10" fill="#fef3c7" stroke="#64748b"/><text x="52" y="268" font-size="22" font-weight="700">Кільцевий буфер</text><text x="52" y="300" font-size="18">Масив, індекс початку, кількість.</text><text x="52" y="330" font-size="18">Місткість обмежена.</text><text x="52" y="358" font-size="18">Немає зсувів після вилучення.</text><text x="483" y="268" font-size="22" font-weight="700">Зв’язний список</text><text x="483" y="300" font-size="18">Вузли, head, tail і зв’язки next.</text><text x="483" y="330" font-size="18">Пам’ять виділяється для вузлів.</text><text x="483" y="358" font-size="18">Після вилучення вузол звільняють.</text><text x="32" y="420" font-size="17">Обидва подання зберігають FIFO; обмеження й помилки теж є частиною контракту.</text>
</g>
</svg>
