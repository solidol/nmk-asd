<svg xmlns="http://www.w3.org/2000/svg" width="900" height="478" viewBox="0 0 900 478" role="img" aria-labelledby="title desc">
<title id="title">Стек, черга та дек</title>
<desc id="desc">Стек додає і вилучає праворуч. Черга додає праворуч і вилучає ліворуч. Дек дозволяє обидві операції з обох кінців.</desc>
<rect width="900" height="478" rx="18" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
<text x="32" y="42" font-size="25" font-weight="700">Доступ визначає абстрактну структуру</text><text x="32" y="88" font-size="22" font-weight="700">Стек · LIFO</text><text x="32" y="117" font-size="17">Обидві операції на одному кінці.</text><rect x="350" y="64" width="90" height="52" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="376" y="97" font-size="21">10</text><rect x="450" y="64" width="90" height="52" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="476" y="97" font-size="21">20</text><rect x="550" y="64" width="90" height="52" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="576" y="97" font-size="21">30</text><text x="660" y="84" font-size="17">додати</text><path d="M740 73H644" fill="none" stroke="#475569" stroke-width="2"/><path d="M652 68L644 73L652 78Z" fill="#475569"/><text x="660" y="137" font-size="17">вилучити</text><path d="M640 117H758" fill="none" stroke="#475569" stroke-width="2"/><path d="M750 112L758 117L750 122Z" fill="#475569"/><text x="32" y="230" font-size="22" font-weight="700">Черга · FIFO</text><text x="32" y="259" font-size="17">Додавання праворуч, вилучення ліворуч.</text><rect x="350" y="206" width="90" height="52" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="376" y="239" font-size="21">10</text><rect x="450" y="206" width="90" height="52" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="476" y="239" font-size="21">20</text><rect x="550" y="206" width="90" height="52" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="576" y="239" font-size="21">30</text><path d="M350 277H237" fill="none" stroke="#475569" stroke-width="2"/><path d="M245 272L237 277L245 282Z" fill="#475569"/><text x="237" y="305" font-size="17">вилучити 10</text><path d="M766 232H643" fill="none" stroke="#475569" stroke-width="2"/><path d="M651 227L643 232L651 237Z" fill="#475569"/><text x="660" y="267" font-size="17">додати</text><text x="32" y="372" font-size="22" font-weight="700">Дек</text><text x="32" y="401" font-size="17">Обидві дії з обох кінців.</text><rect x="350" y="348" width="90" height="52" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="376" y="381" font-size="21">10</text><rect x="450" y="348" width="90" height="52" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="476" y="381" font-size="21">20</text><rect x="550" y="348" width="90" height="52" rx="10" fill="#e0f2fe" stroke="#64748b"/><text x="576" y="381" font-size="21">30</text><path d="M252 360H346" fill="none" stroke="#475569" stroke-width="2"/><path d="M338 355L346 360L338 365Z" fill="#475569"/><path d="M348 398H253" fill="none" stroke="#475569" stroke-width="2"/><path d="M261 393L253 398L261 403Z" fill="#475569"/><path d="M737 360H644" fill="none" stroke="#475569" stroke-width="2"/><path d="M652 355L644 360L652 365Z" fill="#475569"/><path d="M642 398H738" fill="none" stroke="#475569" stroke-width="2"/><path d="M730 393L738 398L730 403Z" fill="#475569"/><text x="245" y="438" font-size="17">лівий кінець</text><text x="640" y="438" font-size="17">правий кінець</text>
</g>
