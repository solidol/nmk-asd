<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Однозв’язний список</title>
  <desc id="desc">Покажчик head веде до вузла 10, далі next веде до 20 і 30, останній next дорівнює nullptr. Вузли не зобов’язані лежати поруч у пам’яті.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#245b85"/></marker></defs>
  <rect width="960" height="250" rx="14" fill="#f5f8fc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#18334b">
    <text x="30" y="36" font-size="23" font-weight="600">Порядок задають зв’язки, а не адреси сусідніх комірок</text>
    <g fill="#e0edf8" stroke="#245b85" stroke-width="2">
      <rect x="160" y="85" width="150" height="65" rx="6"/>
      <rect x="400" y="85" width="150" height="65" rx="6"/>
      <rect x="640" y="85" width="150" height="65" rx="6"/>
      <path d="M235 85V150 M475 85V150 M715 85V150"/>
    </g>
    <g font-size="21" text-anchor="middle">
      <text x="65" y="125">head</text><text x="197" y="125">10</text><text x="273" y="125">next</text>
      <text x="437" y="125">20</text><text x="513" y="125">next</text>
      <text x="677" y="125">30</text><text x="753" y="125">next</text><text x="883" y="125">nullptr</text>
    </g>
    <g fill="none" stroke="#245b85" stroke-width="2.5" marker-end="url(#arrow)"><path d="M98 118H155"/><path d="M310 118H395"/><path d="M550 118H635"/><path d="M790 118H837"/></g>
    <text x="160" y="177" font-size="17">value</text><text x="245" y="177" font-size="17">зв’язок</text>
    <text x="30" y="220" font-size="19">Порожній список: head == nullptr. Кожен прямокутник — окремий вузол.</text>
  </g>
</svg>
