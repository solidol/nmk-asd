<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title"><title id="title">Бітові карти та інвертований індекс</title><rect width="900" height="300" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="20" fill="#0f172a"><text x="35" y="35">Біти для записів 0, 1, 2, 3</text><text x="35" y="90">На складі:   1 0 1 1</text><text x="35" y="140">Акційний:    0 1 1 0</text><text x="35" y="190">AND:             0 0 1 0</text><path d="M450 25 V260" stroke="#94a3b8"/><text x="490" y="35">Термін → документи</text><rect x="490" y="60" width="370" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="675" y="87" text-anchor="middle">дерево → [1, 3]</text><rect x="490" y="120" width="370" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="675" y="147" text-anchor="middle">пошук → [2, 3]</text><text x="490" y="220">Перетин: [3]</text><text x="35" y="275">Ліворуч знайдено запис 2; праворуч — документ 3.</text></g></svg>
