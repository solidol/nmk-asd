<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title"><title id="title">Впорядкований індекс і записи</title><rect width="900" height="300" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="20" fill="#0f172a"><text x="45" y="35">Записи: позиція, код, назва</text><text x="510" y="35">Індекс: ключ → позиція запису</text><rect x="45" y="55" width="320" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="205" y="82" text-anchor="middle">0: 30, ruler</text><rect x="45" y="105" width="320" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="205" y="132" text-anchor="middle">1: 10, pen</text><rect x="45" y="155" width="320" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="205" y="182" text-anchor="middle">2: 20, pencil</text><rect x="45" y="205" width="320" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="205" y="232" text-anchor="middle">3: 20, notebook</text><rect x="510" y="55" width="320" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="670" y="82" text-anchor="middle">10 → 1</text><rect x="510" y="105" width="320" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="670" y="132" text-anchor="middle">20 → 2</text><rect x="510" y="155" width="320" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="670" y="182" text-anchor="middle">20 → 3</text><rect x="510" y="205" width="320" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="670" y="232" text-anchor="middle">30 → 0</text><text x="45" y="283">Порядок записів незмінний; індекс відсортований за кодом.</text></g></svg>
