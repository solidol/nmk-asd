<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title"><title id="title">B+дерево: розділові ключі та зв’язані листки</title><rect width="900" height="300" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" font-size="20" fill="#0f172a"><rect x="330" y="30" width="240" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="450" y="57" text-anchor="middle">20 | 40</text><path d="M370 70 L150 145 M450 70 V145 M530 70 L750 145" stroke="#475569" stroke-width="3" fill="none"/><rect x="40" y="145" width="220" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="150" y="172" text-anchor="middle">5 → r₀; 10 → r₁</text><rect x="340" y="145" width="220" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="450" y="172" text-anchor="middle">20 → r₂; 30 → r₃</text><rect x="640" y="145" width="220" height="40" rx="5" fill="#dbeafe" stroke="#2563eb"/><text x="750" y="172" text-anchor="middle">40 → r₄; 45 → r₅</text><text x="285" y="173">→</text><text x="585" y="173">→</text><text x="45" y="235">rᵢ — посилання на запис; внутрішні ключі спрямовують пошук.</text><text x="45" y="275">Діапазон [20; 45]: середній листок, потім правий.</text></g></svg>
