<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Поворот зі збереженням порядку ключів</title><desc id="desc">Поворот зі збереженням порядку ключів. Вузли та зв’язки підписано; пояснення наведено в лекції.</desc>
<rect width="100%" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172554">
<text x="24" y="34" font-size="22">Поворот зі збереженням порядку ключів</text>
<line x1="147.9" y1="115.9" x2="202.1" y2="164.1" stroke="#64748b" stroke-width="2.5"/>
<line x1="237.9" y1="195.9" x2="292.1" y2="244.1" stroke="#64748b" stroke-width="2.5"/>
<line x1="633.9" y1="117.8" x2="566.1" y2="192.2" stroke="#64748b" stroke-width="2.5"/>
<line x1="666.1" y1="117.8" x2="733.9" y2="192.2" stroke="#64748b" stroke-width="2.5"/>
<circle cx="130" cy="100" r="23" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="130" y="107" text-anchor="middle" font-size="19">10</text>
<circle cx="220" cy="180" r="23" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="220" y="187" text-anchor="middle" font-size="19">20</text>
<circle cx="310" cy="260" r="23" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="310" y="267" text-anchor="middle" font-size="19">30</text>
<circle cx="650" cy="100" r="23" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="650" y="107" text-anchor="middle" font-size="19">20</text>
<circle cx="550" cy="210" r="23" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="550" y="217" text-anchor="middle" font-size="19">10</text>
<circle cx="750" cy="210" r="23" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="750" y="217" text-anchor="middle" font-size="19">30</text>
<text x="370" y="180" font-size="17">→</text>
<text x="350" y="220" font-size="17">Лівий поворот</text>
<text x="80" y="340" font-size="17">До: 10, 20, 30</text>
<text x="550" y="340" font-size="17">Після: 10, 20, 30</text>
</g></svg>
