<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">Набір адрес дітей: масив і список</title><desc id="desc">Набір адрес дітей: масив і список. Пояснення наведено в лекції.</desc>
<rect width="1100" height="100%" rx="16" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172554">
<text x="25" y="36" font-size="23">Набір адрес дітей: масив і список</text>
<circle cx="110" cy="120" r="23" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="110" y="127" text-anchor="middle" font-size="20">A</text>
<circle cx="110" cy="285" r="23" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="110" y="292" text-anchor="middle" font-size="20">A</text>
<text x="180" y="100" font-size="18">Масив адрес: індекси 0, 1, 2, 3, 4</text>
<text x="180" y="145" font-size="18">[ &amp;B ]   [ &amp;C ]   [ &amp;D ]   [ &amp;E ]   [ &amp;F ]</text>
<text x="180" y="185" font-size="18">Доступ до позиції: O(1); зсуви: O(k)</text>
<text x="180" y="270" font-size="18">Список адрес:</text>
<text x="180" y="310" font-size="18">[ &amp;B | • ] → [ &amp;C | • ] → [ &amp;D | • ] → [ &amp;E | • ] → [ &amp;F | null ]</text>
<text x="180" y="355" font-size="18">Послідовний доступ: O(k); вставлення після відомого елемента: O(1)</text>
</g></svg>
