<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
<title id="title">Шлях пошуку 6 у двійковому дереві пошуку</title><desc id="desc">Шлях пошуку 6 у двійковому дереві пошуку. Пояснення наведено в тексті лекції.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="840" height="460" rx="16" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172554"><text x="30" y="35" font-size="24" text-anchor="start">Пошук ключа 6</text><line x1="229.6148085639942" y1="101.1382765535046" x2="150.3851914360058" y2="163.8617234464954" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><line x1="270.3851914360058" y1="101.1382765535046" x2="349.6148085639942" y2="163.8617234464954" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="114.5768250107039" y1="200.93145177118757" x2="75.4231749892961" y2="254.06854822881243" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="146.74752939035227" y1="199.88769115104333" x2="193.25247060964773" y2="255.11230884895667" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><line x1="386.11075150305453" y1="200.40695190386907" x2="428.88924849694547" y2="254.59304809613093" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="198.86975503678485" y1="298.497183811232" x2="176.13024496321515" y2="346.502816188768" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="222.1094072536482" y1="298.00787378193155" x2="247.8905927463518" y2="346.99212621806845" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><circle cx="60" cy="275" r="23" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="60" y="282" font-size="20" text-anchor="middle">1</text><circle cx="130" cy="180" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="130" y="187" font-size="20" text-anchor="middle">3</text><circle cx="165" cy="370" r="23" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="165" y="377" font-size="20" text-anchor="middle">4</text><circle cx="210" cy="275" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="210" y="282" font-size="20" text-anchor="middle">6</text><circle cx="260" cy="370" r="23" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="260" y="377" font-size="20" text-anchor="middle">7</text><circle cx="250" cy="85" r="23" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="250" y="92" font-size="20" text-anchor="middle">8</text><circle cx="370" cy="180" r="23" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="370" y="187" font-size="20" text-anchor="middle">10</text><circle cx="445" cy="275" r="23" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="445" y="282" font-size="20" text-anchor="middle">14</text><text x="500" y="110" font-size="20" text-anchor="start">6 &lt; 8 → ліворуч</text><text x="500" y="160" font-size="20" text-anchor="start">6 > 3 → праворуч</text><text x="500" y="210" font-size="20" text-anchor="start">6 = 6 → знайдено</text><text x="500" y="280" font-size="17" text-anchor="start">Усі ключі ліворуч від 8 &lt; 8</text><text x="500" y="315" font-size="17" text-anchor="start">Усі ключі праворуч від 8 > 8</text><text x="30" y="425" font-size="18" text-anchor="start">Виділений шлях: 8 → 3 → 6. Інші гілки не переглядаються.</text></g></svg>
