<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Запис і масив записів</title>
  <desc id="desc">Один запис BookCopy містить цілий номер id та логічну ознаку borrowed. Три записи розміщені в масиві послідовно з кроком sizeof(BookCopy). Розміри полів і вирівнювання на схемі умовні.</desc>
  <rect width="900" height="470" rx="18" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
    <text x="32" y="43" font-size="25" font-weight="700">Запис описує об’єкт; масив об’єднує записи</text>
    <text x="32" y="86" font-size="20" font-weight="700">Один BookCopy</text>
    <rect x="32" y="108" width="395" height="84" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <rect x="447" y="108" width="421" height="84" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="52" y="141" font-size="20">id — цілий номер</text>
    <text x="52" y="173" font-size="19">17</text>
    <text x="467" y="141" font-size="20">borrowed — ознака видачі</text>
    <text x="467" y="173" font-size="19">false</text>
    <text x="32" y="225" font-size="17">Розміри умовні: між полями та після них можливі проміжки вирівнювання.</text>
    <text x="32" y="271" font-size="20" font-weight="700">Масив books із трьох записів</text>
    <path d="M32 294H868V376H32ZM311 294V376M589 294V376" fill="#fff" stroke="#64748b" stroke-width="2"/>
    <g text-anchor="middle">
      <g font-size="19" font-weight="600"><text x="171" y="325">books[0]</text><text x="450" y="325">books[1]</text><text x="729" y="325">books[2]</text></g>
      <g font-size="18"><text x="171" y="355">17 · false</text><text x="450" y="355">24 · true</text><text x="729" y="355">31 · false</text></g>
    </g>
    <text x="32" y="413" font-size="18">Крок між записами = sizeof(BookCopy), включно з вирівнюванням.</text>
    <text x="32" y="444" font-size="18">Номер 24 — ключ об’єкта; 1 — його поточний індекс у масиві.</text>
  </g>
</svg>
