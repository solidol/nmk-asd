<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Розміщення одновимірного масиву</title>
  <desc id="desc">Чотири елементи зі значеннями 17, 24, 31 і 42 мають індекси від 0 до 3 та байтові зміщення 0, s, 2s і 3s. Позицію після масиву не можна розіменовувати.</desc>
  <rect width="900" height="350" rx="18" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
    <text x="32" y="43" font-size="25" font-weight="700">Масив: позиція → зміщення → елемент</text>
    <text x="32" y="81" font-size="18">N = 4 елементи; s = sizeof(T) байтів на один елемент</text>
    <text x="32" y="127" font-size="18">Індекс</text>
    <text x="32" y="182" font-size="18">Значення</text>
    <text x="32" y="239" font-size="18">Зміщення</text>
    <path d="M190 145H750V207H190ZM330 145V207M470 145V207M610 145V207" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <g text-anchor="middle" font-size="21">
      <text x="260" y="127">0</text><text x="400" y="127">1</text><text x="540" y="127">2</text><text x="680" y="127">3</text>
      <text x="260" y="183">17</text><text x="400" y="183">24</text><text x="540" y="183">31</text><text x="680" y="183">42</text>
      <text x="260" y="239">0</text><text x="400" y="239">s</text><text x="540" y="239">2s</text><text x="680" y="239">3s</text>
    </g>
    <path d="M750 138V253" stroke="#b45309" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="764" y="171" font-size="17" fill="#92400e">Кінець</text>
    <text x="764" y="198" font-size="17" fill="#92400e">масиву</text>
    <text x="32" y="290" font-size="18">Адреса елемента i: початкова адреса + i · s байтів.</text>
    <text x="32" y="321" font-size="18">Позиція 4 — за останнім елементом; читати чи записувати туди не можна.</text>
  </g>
</svg>
