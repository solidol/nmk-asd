<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
  <title id="title">Розміщення матриці рядками</title>
  <desc id="desc">Матриця два на три зі значеннями 10, 11, 12 у першому рядку та 20, 21, 22 у другому лінеаризується в такому самому порядку. Координати 1, 2 відповідають позиції 5.</desc>
  <rect width="900" height="490" rx="18" fill="#f8fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#0f172a">
    <text x="32" y="43" font-size="25" font-weight="700">Матриця 2 × 3: останній індекс змінюється найшвидше</text>
    <g font-size="18" text-anchor="middle">
      <text x="180" y="92">j = 0</text><text x="280" y="92">j = 1</text><text x="380" y="92">j = 2</text>
      <text x="73" y="144">i = 0</text><text x="73" y="204">i = 1</text>
    </g>
    <path d="M130 109H430V169H130Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <path d="M130 169H430V229H130Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M230 109V229M330 109V229" stroke="#64748b" stroke-width="2"/>
    <g font-size="23" text-anchor="middle">
      <text x="180" y="147">10</text><text x="280" y="147">11</text><text x="380" y="147">12</text>
      <text x="180" y="207">20</text><text x="280" y="207">21</text><text x="380" y="207">22</text>
    </g>
    <text x="480" y="133" font-size="21" font-weight="700">Позиція = i · C + j</text>
    <text x="480" y="169" font-size="19">Для (1, 2): 1 · 3 + 2 = 5</text>
    <text x="480" y="205" font-size="18">Зміщення: 5 · sizeof(T) байтів</text>
    <path d="M450 254V285" stroke="#475569" stroke-width="2"/>
    <path d="M443 281L450 293L457 281Z" fill="#475569"/>
    <path d="M90 312H450V372H90Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <path d="M450 312H810V372H450Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <path d="M210 312V372M330 312V372M570 312V372M690 312V372" stroke="#64748b" stroke-width="2"/>
    <g font-size="23" text-anchor="middle">
      <text x="150" y="350">10</text><text x="270" y="350">11</text><text x="390" y="350">12</text>
      <text x="510" y="350">20</text><text x="630" y="350">21</text><text x="750" y="350">22</text>
    </g>
    <g font-size="17" text-anchor="middle" fill="#475569">
      <text x="150" y="400">0</text><text x="270" y="400">1</text><text x="390" y="400">2</text>
      <text x="510" y="400">3</text><text x="630" y="400">4</text><text x="750" y="400">5</text>
      <text x="270" y="439">Рядок 0</text><text x="630" y="439">Рядок 1</text>
    </g>
  </g>
</svg>
